name: Create new release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.4)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: web

      - name: Run build script
        run: bun run build
        working-directory: web

      - name: Install zip
        run: sudo apt install zip

      - name: Bundle files
        run: |
          mkdir -p ./temp/ac_scoreboard
          mkdir -p ./temp/ac_scoreboard/web/
          cp ./{LICENSE,README.md,fxmanifest.lua,config.lua} ./temp/ac_scoreboard
          cp -r ./{locales,modules,resource} ./temp/ac_scoreboard
          cp -r ./web/build ./temp/ac_scoreboard/web/
          cd ./temp && zip -r ../ac_scoreboard.zip ./ac_scoreboard

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: false
          files: ac_scoreboard.zip
